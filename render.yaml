# Render Blueprint: https://render.com/docs/blueprint-spec
# Free plan, no credit card needed. Data is kept in a free PostgreSQL database
# (for example Neon: https://neon.tech), so nothing is lost when the service sleeps.
services:
  - type: web
    name: shopnest
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Paste your PostgreSQL connection string, e.g.
      # postgresql://user:password@ep-xxxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
      - key: ConnectionStrings__Default
        sync: false
      # The password needs 8+ characters with upper and lower case letters, a digit
      # and a symbol, e.g. MyShop#2026
      - key: Admin__Email
        sync: false
      - key: Admin__Password
        sync: false
